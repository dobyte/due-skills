name: Publish SkillHub

on:
  push:
    branches: [main]
    paths:
      - 'skills/due-v2/SKILL.md'
      - 'skills/due-v2/references/**'
      - 'release/skillhub/SKILL.template'
  workflow_dispatch:
    inputs:
      mode:
        description: "Version mode"
        required: true
        type: choice
        options: [auto, none, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: skillhub-due-skills
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  SKILLHUB_NAMESPACE: ${{ vars.SKILLHUB_NAMESPACE || 'indiv-dobyte' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve online version
        id: online
        env:
          SKILLHUB_KEY: ${{ secrets.SKILLHUB_KEY }}
        run: |
          if [ -z "$SKILLHUB_KEY" ]; then
            echo "SKILLHUB_KEY secret is required" >&2
            exit 1
          fi
          ONLINE=$(python release/skillhub/remote_version.py)
          echo "version=$ONLINE" >> "$GITHUB_OUTPUT"
          if [ -n "$ONLINE" ]; then
            echo "Online version: $ONLINE"
          else
            echo "No published version found; treating as first release"
          fi

      - name: Check pending review
        id: pending
        env:
          ONLINE: ${{ steps.online.outputs.version }}
        run: |
          SUBMITTED=""
          if [ -f release/skillhub/submitted-version.txt ]; then
            SUBMITTED=$(tr -d '[:space:]' < release/skillhub/submitted-version.txt)
          fi
          PENDING=false
          if [ -n "$ONLINE" ] && [ -n "$SUBMITTED" ] && [ "$SUBMITTED" != "$ONLINE" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$SUBMITTED" "$ONLINE" | sort -V | tail -n1)
            if [ "$HIGHEST" = "$SUBMITTED" ]; then
              PENDING=true
              echo "Version $SUBMITTED is pending review; online is $ONLINE. Skipping until it is approved."
            fi
          fi
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          {
            echo "## SkillHub release"
            echo "- Online: ${ONLINE:-none}"
            echo "- Submitted: ${SUBMITTED:-none}"
            echo "- Pending: $PENDING"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bump version
        id: version
        if: steps.pending.outputs.pending != 'true'
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          ONLINE: ${{ steps.online.outputs.version }}
        run: |
          MODE="${INPUT_MODE:-auto}"
          VERSION=$(python release/skillhub/bump_version.py --mode "$MODE" --online "$ONLINE")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Build and validate
        if: steps.pending.outputs.pending != 'true'
        run: python release/skillhub/build.py

      - name: Upload package artifact
        if: steps.pending.outputs.pending != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skillhub-due-skills
          path: release/skillhub/due-skills-*.zip
          if-no-files-found: error

      - name: Commit version and package
        if: steps.pending.outputs.pending != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/due-v2/SKILL.md release/skillhub/SKILL.template release/skillhub/due-skills release/skillhub/due-skills-*.zip
          if git diff --cached --quiet; then
            echo "No version/package changes to commit"
            exit 0
          fi
          git commit -m "chore(skillhub): release v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Install SkillHub CLI
        if: steps.pending.outputs.pending != 'true'
        run: |
          curl -fsSL https://skillhub-1388575217.cos.ap-guangzhou.myqcloud.com/install/install.sh | bash -s -- --cli-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/skillhub" --version

      - name: Publish to skillhub.cn
        if: steps.pending.outputs.pending != 'true'
        env:
          SKILLHUB_KEY: ${{ secrets.SKILLHUB_KEY }}
        run: |
          if [ -z "$SKILLHUB_KEY" ]; then
            echo "SKILLHUB_KEY secret is required" >&2
            exit 1
          fi
          python release/skillhub/publish.py --no-build --changelog "Release v${{ steps.version.outputs.version }}"

      - name: Record submitted version
        if: steps.pending.outputs.pending != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          printf '%s\n' "$VERSION" > release/skillhub/submitted-version.txt
          git add release/skillhub/submitted-version.txt
          if git diff --cached --quiet; then
            echo "Submitted version already recorded"
            exit 0
          fi
          git commit -m "chore(skillhub): mark v$VERSION submitted [skip ci]"
          git push origin HEAD:main
