syntax = "proto3";

package common;

option go_package = "example-server/internal/protocol/common;common";

// 业务错误码。编号一经分配禁止复用，与 internal/code 一一对应。
enum Code {
  OK = 0;                 // 成功
  Canceled = 1;           // 已取消
  Unknown = 2;            // 未知错误
  InvalidArgument = 3;    // 无效参数
  NotFound = 5;           // 未找到资源
  InternalError = 6;      // 服务器内部错误
  Unauthorized = 7;       // 未授权
  TooManyRequests = 10;   // 请求过于频繁
  ServerIsMaintain = 114; // 服务器维护中
  UserNotExists = 200;    // 用户不存在
}

// 用户信息。跨模块复用的公共消息统一定义在 common.proto。
message UserInfo {
  int64 uid = 1;       // 用户ID
  string nickname = 2; // 昵称
  string avatar = 3;   // 头像
}
